# Rock Island County, IL acquisition-source registry.
# Discovery only: no AWS identifiers, credentials, secrets, or raw owner records.

county:
  key: rock-island
  name: Rock Island County
  state: IL
  fips: "17161"
  discovery_date: "2026-08-01"
  permit_discovery_refreshed_at: "2026-08-14T21:50:52.602Z"
  scope: acquisition-mvp
  working_parcel_denominator:
    value: 65806
    definition: Distinct canonical ten-digit PINs after duplicate-source-record consolidation
    verified_at: "2026-08-03"
    source_record_count: 65956
    caveat: 126 placeholder/non-canonical PIN records are quarantined; 24 extra records across 23 duplicate-PIN groups are consolidated.
  parcel_identifier:
    name: PIN
    source_field: PIN
    type: string
    observed_length: 10
    normalization: Preserve exactly as text; never coerce to a number or remove leading zeroes.
    aliases_to_validate:
      - parcel_number
      - alternate_parcel_number
      - RICO_PARCE

publication:
  status: permission-request-required
  request_document: docs/rock-island-open-data-request.md
  public_after_approval:
    - PIN
    - polygon_geometry
    - GIS_acres_num
    - site_address
    - Site_City
    - Site_State
    - Site_Zip
    - class
    - Zoning
    - EAV
    - EMV
    - taxbill_year
    - source_provenance
    - source_revision
  restricted_pending_explicit_approval:
    - owner1_name
    - owner1_address1
    - owner1_address2
    - owner1_csz
    - Owner_city
    - Owner_state
    - Owner_Zip
    - taxbill_name
    - taxbill_addr1
    - taxbill_addr2
    - taxbill_csz
    - Taxbill_CS
    - Taxbill_zip
  always_private:
    - purchased_email
    - purchased_phone
    - contact_suppression
    - campaign_history
    - owner_responses
    - asking_price
    - acquisition_status
  prohibited_until_approval:
    - full_county_download
    - public_dataset_mirror
    - public_ipfs_upload
    - owner_or_taxbill_publication

crm_handoff:
  join_key:
    name: parcelIdentifier
    source: PIN
    type: string
  open_parcel_feature:
    format: GeoJSON Feature
    geometry:
      types:
        - Polygon
        - MultiPolygon
      crs: EPSG:4326
    properties:
      objectId:
        source: OBJECTID
        type: integer
        identity: false
      countyFips:
        constant: "17161"
        type: string
      parcelIdentifier:
        source: PIN
        type: string
      acreage:
        source: GIS_acres_num
        type: number
      acreageProvenance:
        constant: GIS_acres_num
        type: string
      siteAddress:
        source: site_address
        type: nullable-string
      siteCity:
        source: Site_City
        type: nullable-string
      siteZip:
        source: Site_Zip
        type: nullable-string
      zoning:
        source: Zoning
        type: nullable-string
      landUse:
        source: class
        type: nullable-string
        caveat: Preserve the raw code until the county class dictionary is obtained.
      assessedValue:
        source: EAV
        type: nullable-number
      marketValue:
        source: EMV
        type: nullable-number
      taxableValue:
        source: null
        type: unavailable
        caveat: Do not copy EAV into taxableValue.
      longitude:
        source: X_longitude-or-geometry-centroid
        type: number
      latitude:
        source: Y_latitude-or-geometry-centroid
        type: number
      sourceUrl:
        source: feature_layer_url
        type: string
      sourceRevision:
        source: item_modified-and-taxbill_year
        type: string
      snapshotAt:
        source: ingestion-clock
        type: date-time
  restricted_owner_enrichment:
    storage: private CRM only unless explicitly approved for publication
    records:
      owner:
        source_role: owner1
        fields:
          - owner1_name
          - owner1_address1
          - owner1_address2
          - owner1_csz
          - Owner_city
          - Owner_state
          - Owner_Zip
      taxbill_recipient:
        source_role: taxbill
        fields:
          - taxbill_name
          - taxbill_addr1
          - taxbill_addr2
          - taxbill_csz
          - Taxbill_CS
          - Taxbill_zip
    rule: Never silently treat the tax-bill recipient as the owner.
  private_contact_enrichment:
    system_of_record: parcel-crm
    encryption_required: true
    fields:
      - email
      - phone
      - vendor
      - confidence
      - purchased_at
      - suppression_state
      - compliance_metadata

