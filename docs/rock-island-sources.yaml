source_feasibility:
  county-parcel-gis:
    technical: A full export is technically feasible in at least 33 pages of 2000 records.
    benchmark: Concurrency 2 completed five sampled pages and 10000 records in 294 ms with zero failures; the full PII-free seed then completed in 19.123 seconds.
    recommended_mode: One-shot rate-limited ArcGIS export using the approved non-PII field allow-list; do not duplicate it with a full per-parcel crawl.
  assessment-search:
    technical: Not evaluated because automation is expressly prohibited.
    recommended_mode: County-authorized GIS or bulk assessment artifact only.
  power:
    technical: HIFLD lines and EIA plants are usable public screening inputs.
    gap: No approved open substation-coordinate source.

