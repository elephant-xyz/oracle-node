        status: discovered
      - jurisdiction: Tarpon Springs
        vendor: Click2Gov / aspgov
        url: https://tarp-egov.aspgov.com/Click2GovBP/index.html
        search: application# / address / parcel / name
        probe: playwright-200
        status: discovered
      - jurisdiction: St. Petersburg
        vendor: City portal + ProjectDox (Avolve)
        url: https://www.stpete.org/business/building_permitting/building_permits.php
        eplan: https://stpetersburg-fl-us.avolvecloud.com/
        probe: playwright-200-city-page
        status: needs-review
      - jurisdiction: Belleair
        status: needs-review
      - jurisdiction: Belleair Beach
        status: needs-review
      - jurisdiction: Belleair Bluffs
        status: needs-review
      - jurisdiction: Belleair Shore
        status: needs-review
      - jurisdiction: Gulfport
        status: needs-review
      - jurisdiction: Indian Rocks Beach
        status: needs-review
      - jurisdiction: Indian Shores
        status: needs-review
      - jurisdiction: Kenneth City
        status: needs-review
      - jurisdiction: Madeira Beach
        status: needs-review
      - jurisdiction: North Redington Beach
        status: needs-review
      - jurisdiction: Oldsmar
        status: needs-review
      - jurisdiction: Redington Beach
        status: needs-review
      - jurisdiction: Redington Shores
        status: needs-review
      - jurisdiction: Safety Harbor
        status: needs-review
