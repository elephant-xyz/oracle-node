        status: needs-review
      - jurisdiction: South Pasadena
        status: needs-review
      - jurisdiction: St. Pete Beach
        status: needs-review
      - jurisdiction: Treasure Island
        status: needs-review

  - key: sunbiz
    category: business-registration
    name: Florida Sunbiz corporate registrations (FL Dept. of State)
    base_urls:
      - https://dos.fl.gov/sunbiz/other-services/data-downloads/
      - https://search.sunbiz.org/Inquiry/CorporationSearch/ByName
    access_pattern:
      mode: batch-bulk-download
      tooling: headless Chromium for Data Access Portal (curl 403 on live search)
      auth: public access account out-of-band (never commit)
      anti_bot: Cloudflare on live search
      pinellas_filter: ZIP prefixes from RP_ALL_SITE_ADDRESSES (337xx and 3466x/3467x/3468x/3469x)
    refresh:
      method: quarterly cordata.zip → ZIP-prefix extract → lexicon transform
      cadence: quarterly
    implemented_by:
      skill: sunbiz-corporate-ingest
    in_scope: true

  - key: bbb
    category: business-reputation
    name: Better Business Bureau contractor reputation
    base_urls:
      - https://www.bbb.org/us/category/data
    access_pattern:
      mode: browser-scrape
      tooling: Puppeteer / Playwright (curl 403 Cloudflare; Playwright 200)
      auth: public
    refresh:
      method: category harvest
      cadence: on-demand / periodic
    implemented_by:
      skill: bbb-harvest
    in_scope: true

  - key: tax-collector
    category: tax
    name: Pinellas tax collector / county-taxes bill view
    base_urls:
      - http://pinellas.county-taxes.com/public/real_estate/alternate_key_redirect
    access_pattern:
      mode: per-parcel bill view (linked from PCPAO print page)
    in_scope: false
    unavailable_reason: >-
      Official bill portal exists but is not a bulk public roll; not required for the
      appraisal/permit/Sunbiz/BBB Oracle baseline or the 50-parcel pilot.

  - key: clerk-official-records
    category: recorder
    name: Pinellas Clerk of the Court official records
    base_urls:
      - https://officialrecords.mypinellasclerk.gov/
    access_pattern:
      mode: browser portal
      anti_bot: curl 403
    in_scope: false
    unavailable_reason: >-
      Deed/mortgage images sit behind a bot-walled clerk portal. Book/page already
      appears on the PCPAO print page. Out of pilot unless the operator adds deeds.

  - key: code-enforcement
    category: code-enforcement
    name: Pinellas County Accela Code Enforce module
    base_urls:
      - https://aca-prod.accela.com/PINELLAS/default.aspx
    in_scope: false
    unavailable_reason: Accela module exists; not in Oracle four-source baseline for this pilot.

notes:
  - Oracle four: appraisal PCPAO, permits (municipal), Sunbiz, BBB. Tax/clerk/code/BTR/FEMA
    are named out of pilot (in_scope: false), not missing websites.
  - 18 cities remain needs-review: discovery did not confirm their permit URLs yet.
  - Local ingest (2026-08-27): PCPAO print HTML only. Permits/Sunbiz/BBB not pulled.
  - Reuse Counties-trasform-scripts/pinellas; do not regenerate mapping scripts in discovery.
