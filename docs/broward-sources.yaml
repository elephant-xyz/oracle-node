# Broward County, FL — source catalog (machine-readable registry)
# Discovery 2026-08-27. status: appraisal pilot passed 50/50 Lexicon validation;
# permits: all 32 jurisdictions have a public source or documented custodian;
# adapter certification remains vendor-specific.
# Certify later with scripts/permit-source-discovery/certify.mjs.
county: broward
state: FL
fips: "12011"
dor_county_number: 16
parcel_id:
  name: Folio # Property ID
  length: 12 # characters, alphanumeric (condos include letters)
  display_grouping: "6-2-4" # XXXXXX-XX-XXXX — do NOT send dashes to the API
  example: "474135010090"
  example_condo: "504108BJ0140"

# ---- countywide sources ----
appraisal:
  source: Broward County Property Appraiser (BCPA)
  spa: https://web.bcpa.net/BcpaClient/#/Record-Search
  access: plain-http-json # no browser flow
  search_api:
    method: POST
    url: https://web.bcpa.net/BcpaClient/search.aspx/GetData
    content_type: application/json
    body:
      value: "<query>"
      cities: ""
      orderBy: NAME # empty orderBy returns HTTP 500
      pageNumber: "1"
      pageCount: "10"
      arrayOfValues: ""
      selectedFromList: "false"
      totalCount: "Y"
    returns: d.resultListk__BackingField
  detail_api:
    method: POST
    url: https://web.bcpa.net/BcpaClient/search.aspx/getParcelInformation
    body:
      folioNumber: "<12-char undashed folio>"
      taxyear: "" # NOT "CURRENT" — that returns a null parcel list
      action: CURRENT
      use: ""
    returns: d.parcelInfok__BackingField
  transform: Counties-trasform-scripts/broward/scripts/
  parcel_count_gis: 556178
  probe_p50_seconds: 0.40
  notes:
    - Fail closed when parcelInfok__BackingField is null
    - Keep folio as text; condo folios contain letters
    - elephant-cli requires json (not body) and content-type application/json with no charset
    - Live useCode is often a family label (04 - Condominium); the corrected extractor falls back to the family -01 row
    - Local prepare, corrected transform, and Lexicon validation passed 50/50
    - Full local appraisal ingestion started from 534309 unique GIS folios

gis:
  rest: https://gisweb-adapters.bcpa.net/arcgis/rest/services/BCPA_EXTERNAL_JAN26/MapServer/16
  fields: [FOLIO] # owner/address/value removed 2026-06-06
  max_record_count: 1000
  geometry: polygon
  outSR: 4326
  seed: folio + parcel_polygon; appraisal facts come from detail_api

sunbiz:
  source: FL Division of Corporations (statewide)
  bulk: https://dos.fl.gov/sunbiz/other-services/data-downloads/
  live_search: https://search.sunbiz.org/ # Cloudflare
  note: Candidate ZIPs from official City/Broward GIS; require county-boundary validation because USPS ZIPs cross boundaries
  local_preparation:
    script: ../scripts/prepare-broward-sunbiz-local.mjs
    runbook: ./broward-sunbiz-local-preparation.md
    scope_gate: exact-address validation manifest with Broward FIPS 12011 evidence
