# Overture Places sources

# Global business/POI points from the Overture Maps Foundation places theme,
# clipped per county at extraction. This is the licence / publication record —
# the same `license` / `publication: open-with-attribution` / `bulk_terms.decision`
# shape as `docs/rock-island-sources.yaml`.
#
# These terms were read from Overture's published documentation on 2026-08-12 and
# have not been reviewed by counsel.

source:
  key: overture-places
  name: Overture Maps places
  authority: Overture Maps Foundation
  stac_catalog: "https://stac.overturemaps.org/catalog.json"
  s3_prefix: "s3://overturemaps-us-west-2/release/<release>/theme=places/type=place/"
  azure_mirror: "https://overturemapswestus2.blob.core.windows.net/release/"
  access_pattern:
    mode: public-s3-geoparquet
    auth: none
    reader: duckdb
    extensions:
      - spatial
      - httpfs
    s3_region: us-west-2
  cadence: monthly
  identity: GERS UUID
  category_fields:
    current: taxonomy.hierarchy
    also: taxonomy.primary, taxonomy.alternate, basic_category
    deprecated: categories.primary # removed September 2026; stored as legacy_category_primary
  license: CDLA-Permissive-2.0 and Apache-2.0 per record; no OpenStreetMap lineage in the places theme
  publication: open-with-attribution
  attribution:
    notice_artifact: NOTICE.txt at the root of the published places bucket
    foursquare: "Copyright 2024 Foursquare Labs, Inc. All rights reserved."
    elephant_change_statement: "Elephant's own change date, not Overture's Changed: 2026-03-18"
  approved_datasets:
    - meta
    - microsoft
    - foursquare
    - pinmeto
    - krick
    - rendersEO
    - dac
    - brightquery
    - alltheplaces
    - Overture
    - Overture-signals
  licence_gate: If osm or any unknown dataset appears, stop and do not publish. Overture and Overture-signals are Overture's own lineage, allowed by human decision 2026-08-12.
  caveat: Joining CDLA-Permissive data to OpenStreetMap can make the resulting derivative database ODbL.

pilot:
  county: lee
  county_fips: "12071"
  scoping_baseline_release: "2026-07-22.0"
  scoping_baseline_clip_count: 40190
  extraction_location: laptop # defensible for the first county; load/publish should run in-region later
  pii_publish_gate: approved-2026-08-12-publish-as-is-including-emails-and-phones
  basic_category: pass-through-overture-labels
  parcel_links: later-step-not-ingest

operator_decisions:
  county_order:
    decision: Start with Lee County only.
    decided_at: "2026-08-12"
    not_in_this_pass:
      - orange
      - miami-dade
      - palm-beach
      - santa-clara
  bulk_terms:
    decision: Proceed. Public IPFS publication approved 2026-08-12, including Overture business emails and phones as public business-contact fields.
    requirements:
      - Preserve Overture citation with accessed date.
      - Preserve per-provider licence list for datasets present in the extract.
      - Preserve Foursquare copyright line.
      - Stamp Elephant's own change statement and date.
  publication:
    decision: Approved 2026-08-12. Publish as-is to a dedicated Filebase bucket and IPNS label oracle-open-data-lee-places, including emails and phones.
    gate: Licence assertion must pass; parquet row count must equal business_locations; zero duplicate GERS ids; zero null geometries.
